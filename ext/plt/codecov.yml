codecov:
  branch: master

coverage:
  precision: 2
  round: down
  range: "50...90"
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    patch: off

comment:
  layout: "reach, diff, files"
  require_changes: false

ignore:
  - "tst/**/*"
  - "dev/**/*"
  - ".deps/**/*"
  - "**/*_ut.cpp"
  - "**/*_ut.mm"
