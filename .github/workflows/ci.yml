name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Every job runs in a stock distribution container: dev/ci_linux.sh installs
# the toolchain, the libraries and, for the scenarios, the compositor they
# run under (a headless Sway, the tool's Vulkan on lavapipe), then hands
# over to dev/ci.sh MODE. The build gates the rest.
env:
  UBUNTU_IMAGE: ubuntu:26.04
  GCC_IMAGE: gcc:16.1.0-trixie
  ALPINE_IMAGE: alpine:3.24.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the tools
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh build clang \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build.log" \
            --title "Build" \
            --reproduce "dev/ci.sh build"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  style:
    name: Style
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y --no-install-recommends clang-format-21

      - name: Format and diff
        run: |
          CLANG_FORMAT=clang-format-21 python3 dev/style.py
          git diff --exit-code

  tests-glibc:
    name: Tests GCC / glibc
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$GCC_IMAGE" sh dev/ci_linux.sh test gcc \
            2>&1 | tee "$RUNNER_TEMP/tests-glibc.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-glibc-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-glibc.log" \
            --title "Tests GCC / glibc" \
            --reproduce "CC=gcc CXX=g++ dev/ci.sh test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-glibc-log
          path: ${{ runner.temp }}/tests-glibc.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-musl:
    name: Tests Clang / Alpine musl
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$ALPINE_IMAGE" sh dev/ci_linux.sh test clang \
            2>&1 | tee "$RUNNER_TEMP/tests-musl.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-musl-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-musl.log" \
            --title "Tests Clang / Alpine musl" \
            --reproduce "dev/ci.sh test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-musl-log
          path: ${{ runner.temp }}/tests-musl.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-asan:
    name: Tests Clang / ASan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh asan clang \
            2>&1 | tee "$RUNNER_TEMP/tests-asan.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-asan.log" \
            --title "Tests Clang / ASan" \
            --reproduce "dev/ci.sh asan"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-log
          path: ${{ runner.temp }}/tests-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-ubsan:
    name: Tests Clang / UBSan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh ubsan clang \
            2>&1 | tee "$RUNNER_TEMP/tests-ubsan.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-ubsan-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-ubsan.log" \
            --title "Tests Clang / UBSan" \
            --reproduce "dev/ci.sh ubsan"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-ubsan-log
          path: ${{ runner.temp }}/tests-ubsan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh coverage clang \
            2>&1 | tee "$RUNNER_TEMP/coverage.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: .coverage/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: linux-clang
          verbose: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            .coverage/coverage.info
            .coverage/summary.txt
            .coverage/html
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/coverage.log" \
            --title "Coverage" \
            --reproduce "dev/ci.sh coverage"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-log
          path: ${{ runner.temp }}/coverage.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
