name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Every job runs in a stock distribution container: dev/ci_linux.sh installs
# the toolchain, the libraries and, for the scenarios, the compositor they
# run under (a headless Sway, the tool's Vulkan on lavapipe), then hands
# over to dev/ci.sh MODE. The build gates the rest.
env:
  UBUNTU_IMAGE: ubuntu:26.04
  GCC_IMAGE: gcc:16.1.0-trixie
  ALPINE_IMAGE: alpine:3.24.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the tools
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh build clang \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build.log" \
            --title "Build" \
            --reproduce "dev/ci.sh build"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  style:
    name: Style
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y --no-install-recommends clang-format-21

      - name: Format and diff
        run: |
          CLANG_FORMAT=clang-format-21 python3 dev/style.py
          git diff --exit-code

  tests-glibc:
    name: Tests GCC / glibc
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Give lavapipe its dma-bufs
        # lavapipe exports a fence as a sync file, which the tools wait for
        # in their event loop, only when it can make dma-bufs through udmabuf
        run: |
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          test -e /dev/udmabuf
          sudo chmod 666 /dev/udmabuf

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm --device /dev/udmabuf \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$GCC_IMAGE" sh dev/ci_linux.sh test gcc \
            2>&1 | tee "$RUNNER_TEMP/tests-glibc.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-glibc-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-glibc.log" \
            --title "Tests GCC / glibc" \
            --reproduce "CC=gcc CXX=g++ dev/ci.sh test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-glibc-log
          path: ${{ runner.temp }}/tests-glibc.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-musl:
    name: Tests Clang / Alpine musl
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Give the compositor its dma-bufs
        # Alpine's sway runs on wlroots' Vulkan renderer there (the HDR
        # scenarios want its colour management), which allocates the
        # headless output's buffers through udmabuf; the runner's kernel
        # has it built in
        run: |
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          test -e /dev/udmabuf
          sudo chmod 666 /dev/udmabuf

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm --device /dev/udmabuf \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$ALPINE_IMAGE" sh dev/ci_linux.sh test clang \
            2>&1 | tee "$RUNNER_TEMP/tests-musl.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-musl-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-musl.log" \
            --title "Tests Clang / Alpine musl" \
            --reproduce "dev/ci.sh test"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-musl-log
          path: ${{ runner.temp }}/tests-musl.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-asan:
    name: Tests Clang / ASan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Give lavapipe its dma-bufs
        # lavapipe exports a fence as a sync file, which the tools wait for
        # in their event loop, only when it can make dma-bufs through udmabuf
        run: |
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          test -e /dev/udmabuf
          sudo chmod 666 /dev/udmabuf

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm --device /dev/udmabuf \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh asan clang \
            2>&1 | tee "$RUNNER_TEMP/tests-asan.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-asan.log" \
            --title "Tests Clang / ASan" \
            --reproduce "dev/ci.sh asan"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-log
          path: ${{ runner.temp }}/tests-asan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-ubsan:
    name: Tests Clang / UBSan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Give lavapipe its dma-bufs
        # lavapipe exports a fence as a sync file, which the tools wait for
        # in their event loop, only when it can make dma-bufs through udmabuf
        run: |
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          test -e /dev/udmabuf
          sudo chmod 666 /dev/udmabuf

      - name: Build the tools and run the scenarios
        run: |
          set -o pipefail
          docker run --rm --device /dev/udmabuf \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh ubsan clang \
            2>&1 | tee "$RUNNER_TEMP/tests-ubsan.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-ubsan-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-ubsan.log" \
            --title "Tests Clang / UBSan" \
            --reproduce "dev/ci.sh ubsan"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-ubsan-log
          path: ${{ runner.temp }}/tests-ubsan.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage-ubuntu:
    name: Coverage Ubuntu
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Give lavapipe its dma-bufs
        # lavapipe exports a fence as a sync file, which the tools wait for
        # in their event loop, only when it can make dma-bufs through udmabuf
        run: |
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          test -e /dev/udmabuf
          sudo chmod 666 /dev/udmabuf

      - name: Build the tools and run the scenarios with coverage
        run: |
          set -o pipefail
          docker run --rm --device /dev/udmabuf \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh coverage clang \
            2>&1 | tee "$RUNNER_TEMP/coverage-ubuntu.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ubuntu-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Upload the shard's tracefile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ubuntu
          path: |
            .coverage/coverage.info
            .coverage/summary.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/coverage-ubuntu.log" \
            --title "Coverage Ubuntu" \
            --reproduce "dev/ci.sh coverage"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ubuntu-log
          path: ${{ runner.temp }}/coverage-ubuntu.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage-alpine:
    name: Coverage Alpine
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Give the compositor its dma-bufs
        # as in the Alpine tests job: wlroots' Vulkan renderer allocates
        # through udmabuf
        run: |
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf || true
          test -e /dev/udmabuf
          sudo chmod 666 /dev/udmabuf

      - name: Build the tools and run the scenarios with coverage
        run: |
          set -o pipefail
          docker run --rm --device /dev/udmabuf \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$ALPINE_IMAGE" sh dev/ci_linux.sh coverage clang \
            2>&1 | tee "$RUNNER_TEMP/coverage-alpine.log"

      - name: Upload what the failed scenarios captured
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-alpine-evidence
          path: .build/ci-*/evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Upload the shard's tracefile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-alpine
          path: |
            .coverage/coverage.info
            .coverage/summary.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/coverage-alpine.log" \
            --title "Coverage Alpine" \
            --reproduce "dev/ci.sh coverage"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-alpine-log
          path: ${{ runner.temp }}/coverage-alpine.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  coverage:
    name: Coverage
    # the two shards see different scenarios: Ubuntu's sway skips the HDR
    # ones, Alpine's runs them; the merge is what Codecov gets
    needs: [coverage-ubuntu, coverage-alpine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the shards' tracefiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-shards

      - name: Merge the shards' tracefiles
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/coverage-report"
          mkdir -p "$report"
          python3 dev/merge_lcov.py \
            --output "$report/coverage.info" \
            --summary "$report/summary.txt" \
            "$RUNNER_TEMP"/coverage-shards/coverage-*/coverage.info
          {
            echo "## Merged coverage"
            echo
            echo '```text'
            cat "$report/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage-report/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: ubuntu-alpine
          verbose: true

      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
