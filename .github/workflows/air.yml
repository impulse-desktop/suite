name: AIR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Reference AIR
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Metal toolchain
        run: |
          xcodebuild -version
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Compile the probes
        run: sh dev/air/reference.sh

      - name: Look for a Metal device
        run: |
          echo 'import Metal; print(MTLCreateSystemDefaultDevice()?.name ?? "no Metal device")' | swift - > dev/air/device.txt 2>&1 || true
          system_profiler SPDisplaysDataType >> dev/air/device.txt 2>&1 || true
          cat dev/air/device.txt

      - name: Upload the reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: air-reference
          path: dev/air
          retention-days: 30

  samples:
    name: AIR samples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile the samples
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            ubuntu:26.04 sh dev/ci_linux.sh air clang

      - name: Upload the samples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: air-samples
          path: .build/air-samples
          retention-days: 7

  check:
    name: Check AIR on Metal
    needs: samples
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the samples
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: air-samples
          path: ${{ runner.temp }}/air-samples

      - name: Run them against their MSL
        run: |
          set -o pipefail
          xcrun -sdk macosx clang -fobjc-arc -framework Foundation -framework Metal dev/air/check.m -o "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check" "$RUNNER_TEMP/air-samples" | tee "$RUNNER_TEMP/check.txt"

      - name: Upload the verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: air-check
          path: ${{ runner.temp }}/check.txt
          if-no-files-found: ignore
          retention-days: 7
