name: AIR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Reference AIR
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Metal toolchain
        run: |
          xcodebuild -version
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Compile the probes
        run: sh dev/air/reference.sh

      - name: Look for a Metal device
        run: |
          echo 'import Metal; print(MTLCreateSystemDefaultDevice()?.name ?? "no Metal device")' | swift - > dev/air/device.txt 2>&1 || true
          system_profiler SPDisplaysDataType >> dev/air/device.txt 2>&1 || true
          cat dev/air/device.txt

      - name: Upload the reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: air-reference
          path: dev/air
          retention-days: 30
